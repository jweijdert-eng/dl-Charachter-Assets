[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-characterassets"
description = "Character Assets voor Alliance Auth — zoek door de assets van al je characters, ook wat er in schepen, containers en Asset Safety ligt."
readme = "README.md"
keywords = [
    "allianceauth",
    "assets",
    "eveonline",
]
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Dutch Legions" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "django-esi",
]

# django-eveuniverse is géén harde eis: het wordt alleen gebruikt om een leeg
# schip als schip te herkennen, en zonder die plugin doen de locatievlaggen dat
# werk al. Zie assets._schip_types.

[tool.hatch]
version.path = "characterassets/__init__.py"
build.include = [
    "/characterassets",
]
